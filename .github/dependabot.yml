version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directories:
      - /src/FinanceSharp
      - /tests/FinanceSharp.Tests
      - /examples/FinanceSharp.Examples
      - /.config
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-patch-and-minor:
        update-types: [minor, patch]
